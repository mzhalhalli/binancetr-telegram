name: 4s tarama
on:
  schedule:
    # her saat başından 3 dk sonra: 1 saatlik mum; 00/04/08/12/16/20 UTC'de (TR 03/07/11/15/19/23) 4 saatlik de
    # GitHub zamanlanmış işleri 5-15 dk geç başlatabilir
    - cron: "3 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tarama
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest'te Python 3 hazır gelir (ayrı kurulum yok: ücretsiz dakikalar her saat çalışmaya yetsin)
      - name: Tara ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_tarama.py
      - name: Son sonucu kaydet (depo aktif kalsın diye)
        if: always()
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add son_sonuc.json || true
          git commit -m "4s tarama sonucu" || true
          git push || true
