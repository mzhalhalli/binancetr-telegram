name: Binance TR tarama (botun son hali)
on:
  schedule:
    # her 15 dakikada bir (UTC); açık mumla taranır. Özel (private) depoda aylık ücretsiz süre yetmeyebilir:
    # o zaman satırı "7 * * * *" yapın (saatte bir).
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tarama
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketler
        run: pip install -q requests
      - name: Tara ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_tarama.py
      - name: Durumu kaydet (aynı sinyal iki kez gitmesin)
        if: always()
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add durum.json data/arz.json || true
          git commit -m "tarama durumu" || true
          git push || true
