name: sert yukselis analizi
# yalnızca analiz-yukselis dalına gönderim (push) yapılınca çalışır; ana daldaki taramayı etkilemez
# commit mesajında [ornek] varsa yalnızca analiz/ornekler.json'daki örnekler incelenir (hızlı)
# commit mesajında [hedef] varsa hedef (1.-4. hedef, zarar-kes) testi çalışır
# commit mesajında [formasyon] varsa grafik ve mum formasyonları testi çalışır (15m, 1h, 4h, 1d, 1w)
# commit mesajında [canli] varsa iyi çıkan 1h/4h yukarı kırılımlar canlı izlenir (analiz/formasyon_canli.py)
on:
  push:
    branches: [analiz-yukselis]
permissions:
  contents: write
concurrency:
  group: yukselis
  cancel-in-progress: true
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Son 30 günün sert yükselişlerini incele
        env:
          ARALIK: "15m"
          GUN: "30"
          SADECE_ORNEK: ${{ contains(github.event.head_commit.message, '[ornek]') && '1' || '0' }}
          HEDEF: ${{ contains(github.event.head_commit.message, '[hedef]') && '1' || '0' }}
          FORMASYON: ${{ contains(github.event.head_commit.message, '[formasyon]') && '1' || '0' }}
          CANLI: ${{ contains(github.event.head_commit.message, '[canli]') && '1' || '0' }}
        run: |
          if [ "$CANLI" = "1" ]; then python3 analiz/formasyon_canli.py
          elif [ "$FORMASYON" = "1" ]; then python3 analiz/formasyon.py
          elif [ "$HEDEF" = "1" ]; then python3 analiz/hedef_backtest.py
          else python3 analiz/yukselis_profili.py; fi
      - name: Sonucu dala kaydet
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add analiz/sonuc
          git commit -m "sert yükseliş analiz sonucu" || true
          git pull --rebase || true
          git push || true
