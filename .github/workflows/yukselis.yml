name: sert yukselis analizi
# yalnızca analiz-yukselis dalına gönderim (push) yapılınca çalışır; ana daldaki taramayı etkilemez
# commit mesajında [ornek] varsa yalnızca analiz/ornekler.json'daki örnekler incelenir (hızlı)
on:
  push:
    branches: [analiz-yukselis]
permissions:
  contents: write
concurrency:
  group: yukselis
  cancel-in-progress: true
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Son 30 günün sert yükselişlerini incele
        env:
          ARALIK: "15m"
          GUN: "30"
          SADECE_ORNEK: ${{ contains(github.event.head_commit.message, '[ornek]') && '1' || '0' }}
        run: python3 analiz/yukselis_profili.py
      - name: Sonucu dala kaydet
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add analiz/sonuc
          git commit -m "sert yükseliş analiz sonucu" || true
          git pull --rebase || true
          git push || true
